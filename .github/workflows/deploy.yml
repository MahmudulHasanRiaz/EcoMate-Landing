name: Production Deployment - Cloudflare Workers (Manual Trigger Only)

# Least privilege: nothing here creates releases or comments, so read is enough.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deployment_notes:
        description: 'Deployment reason / release notes'
        required: false
        default: 'Manual production rollout via GitHub Actions'
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  build_and_verify:
    name: 1. CI Validation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Pinned by SHA (see ci.yml for why); `# v4` keeps Dependabot updates working.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (v24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      # Verifies setup-node actually delivered Node 24. This MUST run after
      # setup-node: checking before it would test the runner-image default Node
      # (v20), not our toolchain — that ordering bug failed CI on PR #1.
      - name: Assert Node floor (24)
        run: node -e "if (parseInt(process.versions.node.split('.')[0], 10) < 24) { console.error('Node 24+ required'); process.exit(1); }"

      - name: Install dependencies (Strict frozen lockfile)
        run: npm ci

      - name: TypeScript typecheck & lint
        run: npm run lint

      # Same guarantee as CI, at deploy time: browser-bundled values must be
      # public. See ci.yml for the SITE_KEY rationale.
      - name: Assert no secrets behind NEXT_PUBLIC_
        run: |
          secretish=$(grep -rEn 'NEXT_PUBLIC_[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|API_KEY)' wrangler.toml .env.example lib app 2>/dev/null || true)
          keyish=$(grep -rEn 'NEXT_PUBLIC_[A-Z0-9_]*KEY' wrangler.toml .env.example lib app 2>/dev/null | grep -v 'SITE_KEY' || true)
          if [ -n "$secretish$keyish" ]; then
            echo "$secretish$keyish"
            echo "::error::A NEXT_PUBLIC_ variable looks like a secret. Move the real value to a Worker secret."
            exit 1
          fi
          echo "no secrets behind NEXT_PUBLIC_"

      # See .github/workflows/ci.yml for the full explanation: `opennextjs-cloudflare
      # build` runs `npm run build` internally, so the package.json build script must
      # never call `opennextjs-cloudflare build` (unbounded recursion).
      - name: Assert no opennext build recursion
        run: |
          node -e "
            const pkg = require('./package.json');
            const script = String((pkg.scripts && pkg.scripts.build) || '');
            if (/opennextjs-cloudflare\s+build/.test(script)) {
              console.error('::error::package.json \"build\" calls opennextjs-cloudflare build, which recurses without bound. It must run the Next.js build (\"next build\").');
              process.exit(1);
            }
            console.log('package.json build script is recursion-safe:', script);
          "

      # Supabase publishes AAAA records and GitHub-hosted runners have
      # no IPv6 route. The direct hostname (db.<ref>.supabase.co) has
      # no A record here, so DNS-based IPv4 pinning cannot help.
      # Instead DIRECT_URL uses the session-pooler endpoint on the
      # standard Postgres port 5432 (aws-0-ap-south-1.pooler.supabase.com),
      # which resolves to IPv4 and is genuine direct connection — NOT
      # the Drizzle/pooler tab URL (port 6543, transaction mode, no DDL).
      # Under `cacheComponents: true` cached data functions run during the
      # build with no Hyperdrive binding and fall back to DIRECT_URL —
      # without this they cannot reach the database and prerender an
      # empty shell instead of real content.
      - name: Validate DIRECT_URL shape (session pooler :5432, not transaction pooler :6543)
        run: |
          node -e "
            const u = process.env.DIRECT_URL || '';
            let p;
            try { p = new URL(u); } catch { console.error('::error::DIRECT_URL is not a valid URL. Set the GitHub Secret DIRECT_URL to the Supabase session-pooler URL:'); console.error('::error::  postgresql://postgres.<ref>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres'); process.exit(1); }
            if (p.protocol !== 'postgresql:' && p.protocol !== 'postgres:') { console.error('::error::DIRECT_URL must use the postgresql:// scheme.'); process.exit(1); }
            if (!p.username) { console.error('::error::DIRECT_URL has no username.'); process.exit(1); }
            if (p.port === '6543') { console.error('::error::DIRECT_URL uses port 6543 (transaction pooler). DDL migrations cannot run in transaction mode. Use the session pooler on port 5432: Supabase dashboard → Connect → Session pooler.'); process.exit(1); }
            console.log('DIRECT_URL shape OK (direct Postgres URL with credentials present; host not shown).');
          "
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build production bundle
        # DIRECT_URL (session pooler :5432) arrives via secret,
        # required here under `cacheComponents: true` so cached
        # data functions prerender real content.
        run: npx opennextjs-cloudflare build

      - name: Verify build artifact integrity
        run: |
          if [ ! -d .open-next ]; then
            echo "::error::CRITICAL: .open-next build output missing! Aborting deployment."
            exit 1
          fi
          echo "Build integrity confirmed. .open-next bundle ready for Cloudflare."

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opennext-bundle
          path: .open-next
          retention-days: 2
          if-no-files-found: error
          # `.open-next` starts with a dot: upload-artifact v4+ excludes hidden
          # paths by default, so without this the step reports "no files found"
          # even though the build just verified the bundle exists (failed prod
          # deploy 2026-10-06).
          include-hidden-files: true

  deploy_to_cloudflare:
    name: 2. Cloudflare Workers Deployment
    needs: [build_and_verify]
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository for configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (v24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      # Verifies setup-node actually delivered Node 24. This MUST run after
      # setup-node: checking before it would test the runner-image default Node
      # (v20), not our toolchain — that ordering bug failed CI on PR #1.
      - name: Assert Node floor (24)
        run: node -e "if (parseInt(process.versions.node.split('.')[0], 10) < 24) { console.error('Node 24+ required'); process.exit(1); }"

      # The opennext CLI that drives the deploy is a project dependency, so the deploy job
      # needs its own install.
      - name: Install dependencies (Strict frozen lockfile)
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opennext-bundle
          path: .open-next

      # `migrate` (journaled SQL from `drizzle/`), never `push` (live schema diff).
      #
      # `db:push` reconciles the database to `db/schema.ts` by whatever means it judges
      # necessary, which on Postgres includes DROPPING columns it believes are unused. Against a
      # production leads table that is data loss performed by a deploy step, and it is not
      # reversible from git. Migrations only ever apply the statements that were generated,
      # reviewed and committed.
      - name: Assert no db:push in this workflow
        run: |
          # Invocation patterns only — see ci.yml for why the broad pattern was retired.
          if grep -rnE 'npm run db:pu[s]h|drizzle-kit[[:space:]]+pu[s]h' .github/workflows/; then
            echo "::error::db:push found in a deploy workflow. It reconciles the live schema by dropping columns and is not safe in production. Use db:migrate."
            exit 1
          fi
          echo "no db:push in any deploy workflow"

      # DIRECT_URL must be the DIRECT port-5432 connection, never Supabase's
      # "Drizzle" tab pooler URL (port 6543, user `postgres.<ref>`): transaction
      # mode cannot run DDL, so migrations fail against it. Validates shape only —
      # hostname and password are never printed. Supabase dashboard → Connect →
      # "Direct connection" tab (host `db.<ref>.supabase.co`, port 5432).
      - name: Assert DIRECT_URL is a direct (non-pooler) URL
        run: |
          node -e "
            const u = process.env.DIRECT_URL || '';
            let p;
            try { p = new URL(u); } catch { console.error('::error::DIRECT_URL is not a valid URL. Set the GitHub Secret DIRECT_URL to the Supabase direct connection string (Connect → Direct connection, port 5432).'); process.exit(1); }
            if (p.protocol !== 'postgresql:' && p.protocol !== 'postgres:') { console.error('::error::DIRECT_URL must use the postgresql:// scheme.'); process.exit(1); }
            if (!p.username) { console.error('::error::DIRECT_URL has no username.'); process.exit(1); }
            if (p.port === '6543') { console.error('::error::DIRECT_URL uses port 6543 (Supabase transaction pooler). DDL migrations cannot run in transaction mode. Use the DIRECT port-5432 URL: Supabase dashboard → Connect → Direct connection (NOT the Drizzle/pooler tab).'); process.exit(1); }
            console.log('DIRECT_URL shape OK (direct Postgres URL with credentials present; host not shown).');
          "
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Apply DB migrations
        # `db:migrate` runs scripts/db-migrate.mjs: a journal-driven runner that
        # prints every decision and every error verbosely. It replaced
        # `drizzle-kit migrate`, which exited 1 silently on connection failure
        # (undiagnosable in deploy logs, 2026-10-06). Same contract — journaled
        # SQL only, never push/diff — plus idempotent completion for legacy rows.
        run: npm run db:migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Baseline content seed (idempotent — safe on every deploy, not just the
      # first). Migrations create TABLES; without this step a fresh/restored
      # database serves empty pages (`{"error":"Settings not seeded"}`) until a
      # human runs the seed by hand — that manual step is what this removes.
      # Safety, verified 2026-10-07: every insert is guarded (existence check or
      # ON CONFLICT DO NOTHING); demo leads insert ONLY into an empty leads
      # table, so real leads are never touched and nothing ever duplicates.
      # A seed failure fails the deploy loudly: shipping code that renders
      # against an empty database silently is worse than a red pipeline.
      - name: Seed baseline content (idempotent)
        run: npm run db:seed
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Ensure R2 bucket exists (idempotent, never deletes)
        run: |
          # Production-only (CR-3): the preview environment was decommissioned, so there
          # is exactly one bucket. `ENV_NAME` is kept for the `--env` deploy flag below.
          ENV_NAME="${{ github.event.inputs.environment || 'production' }}"
          BUCKET="ecomate-media-prod"
          if npx wrangler r2 bucket info "$BUCKET" >/dev/null 2>&1; then
            echo "R2 bucket '$BUCKET' already exists — skipping creation (idempotent)."
          else
            echo "R2 bucket '$BUCKET' not found — creating it now..."
            npx wrangler r2 bucket create "$BUCKET"
            echo "R2 bucket '$BUCKET' created."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Idempotent Hyperdrive ensure + sync. Hyperdrive is a TUNNEL to your Postgres
      # (Supabase now, any Postgres later) — not a Cloudflare database; your data never
      # leaves it. Workers cannot open raw Postgres TCP connections, so without this
      # binding the Worker cannot reach the database at all (dashboard shows 0 bindings).
      #   - ensure: find config by name; create it from DIRECT_URL when missing;
      #   - sync: `hyperdrive update` on EVERY deploy so the tunnel always equals the
      #     DIRECT_URL secret — changing DB later = update the secret, redeploy, done.
      #   - inject: patch the real id into wrangler.toml IN THE RUNNER ONLY (the
      #     PASTE_* placeholder stays committed; no Hyperdrive id ever lives in git).
      # Uses only the existing DIRECT_URL + CLOUDFLARE_* secrets. Never echoes the URL.
      - name: Ensure Hyperdrive config (idempotent, synced to DIRECT_URL)
        run: |
          # Production-only (CR-3): the preview environment was decommissioned.
          ENV_NAME="${{ github.event.inputs.environment || 'production' }}"
          HD_NAME="ecomate-db-prod"
          PLACEHOLDER="PASTE_PROD_HYPERDRIVE_ID"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL is empty — cannot create/sync Hyperdrive '$HD_NAME'. Set the GitHub Secret DIRECT_URL first."
            exit 1
          fi
          # wrangler prints bordered tables (│ ─ ┌...), so column-position parsing
          # captures border glyphs instead of the id (shipped a literal '│' once).
          # Hyperdrive ids are UUIDs: match the name's line, extract the UUID.
          # NOTE: `list` stderr is NOT suppressed: if list itself fails (auth, API
          # outage), we must see it, not silently fall through to create (which then
          # fails confusingly with 2017 "already exists" when the config is really there).
          # `list` prints ids as 32 plain hex chars. The API (`get`/`update`) wants
          # that raw hex form ("use the hexadecimal ID", code 2005 otherwise), and
          # so does wrangler.toml (like every other Cloudflare resource id: KV,
          # D1 — all undashed). Match a standalone 32-hex token on the name's line.
          get_id() {
            npx wrangler hyperdrive list 2>&1 \
              | grep -F "$HD_NAME" \
              | grep -oE "(^|[^0-9a-f])[0-9a-f]{32}([^0-9a-f]|$)" \
              | grep -oE "[0-9a-f]{32}" | head -1
          }
          HD_ID="$(get_id)"
          auth_hint() {
            echo "::error::Cloudflare API rejected the Hyperdrive call (auth error). The CLOUDFLARE_API_TOKEN needs the Hyperdrive permission: Dashboard → Profile → API Tokens → edit the token → Permissions → add Hyperdrive Read+Edit (or re-issue with the Workers + Hyperdrive template). No code or secret-name change needed — same token, one added permission, then re-run."
          }
          # NOTE: wrangler never echoes the connection string back (it prints name +
          # id only), so echoing its output cannot leak DIRECT_URL.
          if [ -z "$HD_ID" ]; then
            echo "Hyperdrive '$HD_NAME' not found — creating it from DIRECT_URL..."
            HD_OUT="$(npx wrangler hyperdrive create "$HD_NAME" --connection-string="$DIRECT_URL" 2>&1)" && HD_OK=1 || HD_OK=0
            if [ "$HD_OK" != "1" ] && echo "$HD_OUT" | grep -qiE "already exists|2017"; then
              echo "Create says it already exists but list missed it — dumping list for diagnosis:"
              npx wrangler hyperdrive list 2>&1 | head -20
              echo "Retrying id resolution..."
              HD_ID="$(get_id)"
              if [ -n "$HD_ID" ]; then
                echo "Recovered id for existing '$HD_NAME' — continuing to sync."
                HD_OK=1
              fi
            fi
            if [ "$HD_OK" != "1" ]; then
              echo "$HD_OUT" | grep -qiE "authenticat|10000|permission" && auth_hint
              echo "--- full wrangler output (no secrets: wrangler never echoes the URL) ---"
              echo "$HD_OUT" | grep -viE "^\s*$" | tail -25
              exit 1
            fi
            echo "$HD_OUT" | tail -3
            HD_ID="$(get_id)"
          else
            echo "Hyperdrive '$HD_NAME' exists — syncing its connection string to DIRECT_URL..."
            HD_OUT="$(npx wrangler hyperdrive update "$HD_ID" --connection-string="$DIRECT_URL" 2>&1)" && HD_OK=1 || HD_OK=0
            if [ "$HD_OK" != "1" ]; then
              echo "$HD_OUT" | grep -qiE "authenticat|10000|permission" && auth_hint
              echo "--- full wrangler output (no secrets: wrangler never echoes the URL) ---"
              echo "$HD_OUT" | grep -viE "^\s*$" | tail -25
              exit 1
            fi
            echo "$HD_OUT" | tail -3
          fi
          if [ -z "$HD_ID" ]; then
            echo "::error::Could not resolve a Hyperdrive id for '$HD_NAME' after create/update. See wrangler output above."
            exit 1
          fi
          case "$HD_ID" in
            ????????????????????????????????) ;;
            *) echo "::error::Resolved Hyperdrive id '$HD_ID' is not 32 hex chars — refusing to patch wrangler.toml (a bad id breaks the deploy with code 10156)."; exit 1 ;;
          esac
          sed -i "s/$PLACEHOLDER/$HD_ID/" wrangler.toml
          echo "Hyperdrive '$HD_NAME' ready and bound for deploy (id injected into runner wrangler.toml)."
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The opennext CLI must drive the deploy. A plain `wrangler deploy` (what
      # `cloudflare/wrangler-action` runs) does not carry the opennext build output/args
      # and silently ships a broken or empty Worker. `--env` selects the matching
      # `[env.*]` block in wrangler.toml (Task 21 §1): deploying without it would
      # fall back to the top-level dev bindings.
      # Worker secrets, pushed from GitHub Secrets on every deploy (idempotent —
      # `secret put` overwrites). This is why no dashboard secret setup is needed:
      # add each value ONCE as a GitHub Secret and CI carries it to the Worker.
      # Skip-if-unset (never wipe): a missing GitHub Secret keeps whatever value
      # the Worker already has, so adopting this incrementally is safe. Removing a
      # secret entirely is still a dashboard/manual `wrangler secret delete` — CI
      # will not delete what you do not give it. Values never printed: GitHub
      # masks secret-sourced env vars in logs, and `printf` (not echo) avoids
      # trailing newlines becoming part of the stored value. `wrangler secret put`
      # reads the value from stdin so it never appears in argv/`ps` either.
      - name: Push Worker secrets from GitHub Secrets (idempotent)
        run: |
          ENV_NAME="${{ github.event.inputs.environment || 'production' }}"
          put_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::warning::GitHub Secret $name is not set — keeping the Worker's existing value (if any). Set it to manage this secret from CI."
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env "$ENV_NAME"
          }
          put_secret AUTH_SECRET "$AUTH_SECRET"
          put_secret SETUP_TOKEN "$SETUP_TOKEN"
          put_secret TOTP_ENCRYPTION_KEY "$TOTP_ENCRYPTION_KEY"
          put_secret META_CAPI_TOKEN "$META_CAPI_TOKEN"
          put_secret META_TEST_EVENT_CODE "$META_TEST_EVENT_CODE"
          put_secret TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
          put_secret LICENSE_PORTAL_API_KEY "$LICENSE_PORTAL_API_KEY"
          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret CRON_SECRET "$CRON_SECRET"
          echo "Worker secrets synced (unset ones left untouched)."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_TEST_EVENT_CODE: ${{ secrets.META_TEST_EVENT_CODE }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          LICENSE_PORTAL_API_KEY: ${{ secrets.LICENSE_PORTAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Deploy to Cloudflare via opennext
        # wrangler 4+ requires a local Postgres connection string to emulate
        # Hyperdrive during deploy validation; it is the DIRECT URL itself
        # (session pooler :5432, NOT transaction pooler :6543). The password
        # is masked by GitHub Actions secret handling — never print it.
        run: npx opennextjs-cloudflare deploy --env ${{ github.event.inputs.environment || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: production
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DIRECT_URL }}

      - name: Output Deployment Confirmation
        run: |
          echo "=========================================================="
          echo " Cloudflare Workers Deployment Completed Successfully"
          echo " Environment: ${{ github.event.inputs.environment }}"
          echo " Notes: ${{ github.event.inputs.deployment_notes }}"
          echo " Triggered by: ${{ github.actor }}"
          echo "=========================================================="
