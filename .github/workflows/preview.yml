# Preview per PR (Task 21 §4). Every pull request gets a live preview worker
# (`--env preview`, isolated Hyperdrive/R2/KV — never prod data) plus the
# Playwright smoke subset and LHCI run against it, commented back on the PR.
#
# ⚠️ UNVERIFIED END TO END — no real PR has been opened against this workflow
# yet. YAML syntax is validated (ruby psych parse); the deploy/smoke/comment
# path needs a live PR to prove itself. See docs/RUNBOOK.md §15.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   PREVIEW_DIRECT_URL    direct (port 5432) Postgres URL of the PREVIEW database
#   PREVIEW_URL           public preview hostname, e.g. https://preview.ecomate.app
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID   same as production deploy
# DIRECT_URL (production) is deliberately NOT used here: a typo must not be
# able to migrate the prod database from a PR run.
name: Preview per PR

on:
  pull_request:
    branches:
      - main
      - master

# Only the latest commit on a PR holds a preview; older runs cancel instead of
# stacking deploys (and migrations) behind each other.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

# contents:read runs the pipeline; pull-requests:write posts the URL + LHCI
# comment. Nothing else needs the token.
permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview deploy + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (v24)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      # Verifies setup-node actually delivered Node 24. This MUST run after
      # setup-node: checking before it would test the runner-image default Node
      # (v20), not our toolchain — that ordering bug failed CI on PR #1.
      - name: Assert Node floor (24)
        run: node -e "if (parseInt(process.versions.node.split('.')[0], 10) < 24) { console.error('Node 24+ required'); process.exit(1); }"

      - name: Install dependencies with frozen package-lock
        run: npm ci

      - name: TypeScript typecheck & lint
        run: npm run lint

      # Journaled migrations only — never db:push (see deploy.yml for why).
      # `db:migrate` runs scripts/db-migrate.mjs: journal-driven, verbose, never
      # silent (it replaced `drizzle-kit migrate`, which exited 1 with no error
      # output on connection failure). Same contract — journaled SQL only.
      # Same DIRECT_URL shape rule as deploy.yml: the secret must hold the direct
      # port-5432 URL (or a session-mode pooler on 5432), never the transaction
      # pooler on 6543. Hostname/password never printed.
      - name: Assert preview DIRECT_URL is a direct (non-pooler) URL
        run: |
          node -e "
            const u = process.env.DIRECT_URL || '';
            let p;
            try { p = new URL(u); } catch { console.error('::error::PREVIEW_DIRECT_URL is not a valid URL.'); process.exit(1); }
            if (p.protocol !== 'postgresql:' && p.protocol !== 'postgres:') { console.error('::error::PREVIEW_DIRECT_URL must use the postgresql:// scheme.'); process.exit(1); }
            if (!p.username) { console.error('::error::PREVIEW_DIRECT_URL has no username.'); process.exit(1); }
            if (p.port === '6543') { console.error('::error::PREVIEW_DIRECT_URL uses port 6543 (transaction pooler). Use a direct port-5432 URL instead.'); process.exit(1); }
            console.log('Preview DIRECT_URL shape OK.');
          "
        env:
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}

      # Same rationale as deploy.yml: GitHub-hosted runners have
      # no IPv6 route, so PREVIEW_DIRECT_URL is rewritten to its
      # IPv4 address here. The migrate, seed and build steps
      # below inherit DIRECT_URL from GITHUB_ENV instead of
      # reading the secret directly — a step-level env would
      # otherwise override the pinned value. The secret value is
      # never printed; an IPv4 literal passes through unchanged.
      - name: Pin DIRECT_URL to IPv4 (runners have no IPv6 route)
        env:
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
        run: |
          node -e '
            const dns = require("node:dns");
            const raw = process.env.DIRECT_URL || "";
            if (!raw) { console.log("DIRECT_URL not set — leaving unset."); process.exit(0); }
            const url = new URL(raw);
            dns.lookup(url.hostname, { family: 4 }, (err, address) => {
              if (err) {
                console.error("::error::Could not resolve an IPv4 address for " + url.hostname + ": " + err.message);
                process.exit(1);
              }
              url.hostname = address;
              require("node:fs").appendFileSync(process.env.GITHUB_ENV, "DIRECT_URL=" + url.toString() + "\n");
              console.log("DIRECT_URL pinned to " + address + " (IPv4).");
            });
          '

      # DIRECT_URL (IPv4-pinned above) arrives via GITHUB_ENV.
      - name: Migrate preview DB
        run: npm run db:migrate

      # Idempotent + transactional (db/seed.ts): safe to re-run per commit.
      # DIRECT_URL (IPv4-pinned above) arrives via GITHUB_ENV.
      - name: Seed preview DB
        run: npm run db:seed

      # DIRECT_URL (IPv4-pinned above) arrives via GITHUB_ENV, so the
      # build's prerender — cached data functions run with no Hyperdrive
      # binding at build time and fall back to DIRECT_URL — can actually
      # populate content instead of degrading to an empty shell.
      - name: Build preview bundle
        run: npx opennextjs-cloudflare build

      - name: Verify build artifact integrity
        run: |
          if [ ! -d .open-next ]; then
            echo "::error::CRITICAL: .open-next build output missing! Aborting preview."
            exit 1
          fi

      # Idempotent R2 bucket ensure for the preview environment. Same contract as
      # deploy.yml: creates `ecomate-media-preview` ONLY when missing (matching the
      # `[env.preview.r2_buckets]` `bucket_name` in wrangler.toml), never deletes or
      # replaces it. Uses only the existing CLOUDFLARE_API_TOKEN /
      # CLOUDFLARE_ACCOUNT_ID secrets.
      - name: Ensure preview R2 bucket exists (idempotent, never deletes)
        run: |
          BUCKET="ecomate-media-preview"
          if npx wrangler r2 bucket info "$BUCKET" >/dev/null 2>&1; then
            echo "R2 bucket '$BUCKET' already exists — skipping creation (idempotent)."
          else
            echo "R2 bucket '$BUCKET' not found — creating it now..."
            npx wrangler r2 bucket create "$BUCKET"
            echo "R2 bucket '$BUCKET' created."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Idempotent Hyperdrive ensure + sync for `ecomate-db-preview`, same contract
      # as deploy.yml: create from PREVIEW_DIRECT_URL when missing, update it on
      # every run so the tunnel always equals the secret, inject the id into the
      # runner's wrangler.toml (placeholder stays committed). Skips cleanly with a
      # clear message when PREVIEW_DIRECT_URL is unset (preview infra is opt-in;
      # the migrate step below already requires the same secret).
      - name: Ensure preview Hyperdrive config (idempotent)
        run: |
          HD_NAME="ecomate-db-preview"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::PREVIEW_DIRECT_URL is not set — cannot create/sync Hyperdrive '$HD_NAME'. Set the GitHub Secret PREVIEW_DIRECT_URL (preview database, direct port-5432 URL) to enable preview deploys."
            exit 1
          fi
          # wrangler prints bordered tables (│ ─ ┌...), so column-position parsing
          # captures border glyphs instead of the id (shipped a literal '│' once).
          # Hyperdrive ids are UUIDs: match the name's line, extract the UUID.
          get_id() {
            npx wrangler hyperdrive list 2>/dev/null \
              | grep -F "$HD_NAME" \
              | grep -oE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" \
              | head -1
          }
          auth_hint() {
            echo "::error::Cloudflare API rejected the Hyperdrive call (auth error). Add the Hyperdrive permission to CLOUDFLARE_API_TOKEN: Dashboard → Profile → API Tokens → edit token → Permissions → Hyperdrive Read+Edit."
          }
          HD_ID="$(get_id)"
          if [ -z "$HD_ID" ]; then
            echo "Hyperdrive '$HD_NAME' not found — creating it from PREVIEW_DIRECT_URL..."
            HD_OUT="$(npx wrangler hyperdrive create "$HD_NAME" --connection-string="$DIRECT_URL" 2>&1)" && HD_OK=1 || HD_OK=0
            if [ "$HD_OK" != "1" ]; then
              echo "$HD_OUT" | grep -qiE "authenticat|10000|permission" && auth_hint
              echo "--- full wrangler output (wrangler never echoes the URL) ---"
              echo "$HD_OUT" | grep -viE "^\s*$" | tail -25
              exit 1
            fi
            echo "$HD_OUT" | tail -3
            HD_ID="$(get_id)"
          else
            echo "Hyperdrive '$HD_NAME' exists — syncing its connection string..."
            HD_OUT="$(npx wrangler hyperdrive update "$HD_ID" --connection-string="$DIRECT_URL" 2>&1)" && HD_OK=1 || HD_OK=0
            if [ "$HD_OK" != "1" ]; then
              echo "$HD_OUT" | grep -qiE "authenticat|10000|permission" && auth_hint
              echo "--- full wrangler output (wrangler never echoes the URL) ---"
              echo "$HD_OUT" | grep -viE "^\s*$" | tail -25
              exit 1
            fi
            echo "$HD_OUT" | tail -3
          fi
          if [ -z "$HD_ID" ]; then
            echo "::error::Could not resolve a Hyperdrive id for '$HD_NAME' after create/update."
            exit 1
          fi
          case "$HD_ID" in
            ????????-????-????-????-????????????) ;;
            *) echo "::error::Resolved Hyperdrive id '$HD_ID' is not a UUID — refusing to patch wrangler.toml (a bad id breaks the deploy with code 10156)."; exit 1 ;;
          esac
          sed -i "s/PASTE_PREVIEW_HYPERDRIVE_ID/$HD_ID/" wrangler.toml
          echo "Hyperdrive '$HD_NAME' ready and bound for deploy."
        env:
          DIRECT_URL: ${{ secrets.PREVIEW_DIRECT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `--env preview` selects [env.preview.*] in wrangler.toml. Deploying a
      # PR without it would fall back to the top-level dev bindings.
      - name: Deploy preview via opennext
        run: npx opennextjs-cloudflare deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Smoke subset, not the whole suite: lead capture (the revenue path) +
      # SEO shell on the preview hostname. Full E2E stays a local gate.
      - name: Playwright smoke against preview
        run: npx playwright test e2e/lead.spec.ts e2e/seo.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PREVIEW_URL }}

      # Reuses lighthouserc.json (assert preset + filesystem upload) with the
      # collect URLs overridden to the preview hostname.
      - name: LHCI against preview
        run: npx lhci autorun --collect.url="${{ secrets.PREVIEW_URL }}/" --collect.url="${{ secrets.PREVIEW_URL }}/bn"

      - name: Archive LHCI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lhci-preview
          path: .lhci
          retention-days: 7
          if-no-files-found: warn

      # URL + LHCI deltas on the PR. LHCI's filesystem upload writes
      # assertion-results.json; when it is absent (collect failed) the comment
      # says so instead of pretending green.
      # `continue-on-error`: a PR comment is a notification, not a gate. It must
      # never fail the workflow — and v4.2.0 (pinned before) crashed on Node 24
      # with `TypeError: Cannot read properties of undefined (reading 'issues')`,
      # so this now pins v7 (SHA below) instead.
      - name: Comment preview URL + LHCI deltas
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const url = '${{ secrets.PREVIEW_URL }}';
            let lhci = '_LHCI did not produce assertion results (collect failed — see the run log)._';
            try {
              const raw = fs.readFileSync('.lhci/assertion-results.json', 'utf8');
              const results = JSON.parse(raw);
              const failed = results.filter((r) => r.level === 'error');
              const warned = results.filter((r) => r.level === 'warn');
              const rows = results.slice(0, 20).map((r) =>
                `| ${r.auditProperty || r.auditId} | ${r.level} | ${r.actual ?? ''} | ${r.expected ?? ''} |`,
              );
              lhci = `**LHCI:** ${failed.length} failed, ${warned.length} warned\n\n` +
                '| audit | level | actual | expected |\n| --- | --- | --- | --- |\n' + rows.join('\n');
            } catch (e) {
              // collect failed before assertions ran — keep the fallback text.
            }
            const body = `## Preview\n\n${url}\n\n${lhci}\n\n_Smoke: \`e2e/lead.spec.ts\`, \`e2e/seo.spec.ts\` on this URL._`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
