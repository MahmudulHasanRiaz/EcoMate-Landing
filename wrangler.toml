name = "ecomate-landing"
# Worker entry point (top level where it belongs — wrangler 4 warns if nested
# under [assets]; opennext builds this file during `opennextjs-cloudflare build`).
main = ".open-next/worker.js"
# Current date, not a stale one: Cloudflare enables new platform behaviour on/after
# this date, and opennext + Next 16 rely on it. 2025-09-01 was already 13 months
# behind at the time of writing. Verify with `npx wrangler deploy --dry-run`
# before the first real deploy, and bump it whenever wrangler warns.
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext builds the Worker bundle and static assets into .open-next/.
# wrangler 4+ requires an explicit entry-point or assets directory.
[assets]
directory = ".open-next/assets"

# ---------------------------------------------------------------------------
# Bindings. Each id below is created once against the real Cloudflare account;
# the two placeholders must be replaced with the ids those commands print.
# ---------------------------------------------------------------------------

# Postgres through Hyperdrive (required by db/client.ts). Create with:
#   npx wrangler hyperdrive create ecomate-db --connection-string="postgresql://postgres:PASSWORD@db.REF.supabase.co:5432/postgres?pgbouncer=true"
# localConnectionString is used by `wrangler deploy` (and opennext) for
# local Hyperdrive emulation — wrangler 4+ refuses to deploy without it.
# Use the session-pooler URL (port 5432, NOT transaction pooler :6543):
#   postgresql://postgres.<ref>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "PASTE_HYPERDRIVE_ID_FROM_STEP_1"
localConnectionString = "postgresql://postgres.<ref>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

# R2 bucket backing the media library (app/api/media/*). Create with:
#   npx wrangler r2 bucket create ecomate-media
# then attach the public custom domain that next.config.ts images.remotePatterns and the
# upload handler's CDN URL both expect:
#   npx wrangler r2 bucket domain ecomate-media --custom-domain media.ecomate.app
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "ecomate-media"

# No KV namespace by decision: rate limiting runs on Cloudflare WAF rate rules
# (dashboard, first layer) plus the per-isolate in-memory backstop. lib/rateLimit.ts
# and /api/ready degrade gracefully when RATE_LIMIT_KV is unbound (fail-open by
# design), so removing this block changes no code path. Re-add a [[kv_namespaces]]
# block here any time to get distributed counters back with zero code change.

[vars]
NEXT_PUBLIC_SITE_URL = "https://dev.ecomate.bd"
NEXT_PUBLIC_DEFAULT_LOCALE = "en"
NEXT_PUBLIC_META_PIXEL_ID = ""
NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""
# R2_PUBLIC_ORIGIN: optional dedicated media CDN origin (e.g.
# "https://media.dev.ecomate.bd" after `wrangler r2 bucket domain` + DNS).
# Unset (default) = same-origin `/media/<key>` proxy, which needs no DNS.
# R2_PUBLIC_ORIGIN = ""

# Auth.js refuses to derive its origin from an untrusted Host header (UntrustedHost).
# `auth.ts` reads this var explicitly (`trustHost: envString('AUTH_TRUST_HOST') === 'true'`)
# rather than using a bare `trustHost: true`, so the value must be present on the Worker:
# because an explicit boolean is passed, Auth.js' own fallbacks — `NODE_ENV !== "production"`
# and `CF_PAGES` (Workers sets neither) — never apply. Without this line every
# `/api/auth/*` request fails in production. Not a secret: it is a deployment property,
# and it only enables host-derived origins on hostnames this zone already serves.
AUTH_TRUST_HOST = "true"

# Lead PII retention (Task 16 §6). A `[vars]` value rather than a secret: the retention window
# is a policy number legal can change, and changing it should not require a secret rotation.
# `app/api/cron/retention/route.ts` clamps it and falls back to 180 if this is missing or
# nonsensical.
RETENTION_DAYS = "180"

# ---------------------------------------------------------------------------
# Scheduled triggers — REMOVED 2026-10-07. The Worker exports no `scheduled()`
# handler, so every cron tick errored ("Handler does not export a scheduled()
# function") while the actual jobs (`/api/cron/retention`, `/api/cron/publish`)
# never ran. Both jobs now fire via `.github/workflows/cron.yml`, which calls
# the same HTTP routes with CRON_SECRET from GitHub Secrets — same auth, same
# code path, observable in Actions instead of silently erroring in dashboard.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Environments (Task 21 §1). The top-level bindings above are LOCAL DEV ONLY.
#
# Why this exists: with a single flat config, one `deploy` without `--env`
# silently repoints production at whatever the top level says. Named
# environments make that impossible: a prod deploy must say `--env
# production` (`npm run deploy:prod`), a PR preview must say `--env preview`
# (`npm run deploy:preview`), and each carries its OWN Hyperdrive id, R2
# bucket and KV namespace so preview traffic can never touch prod data.
#
# Secrets are per-env and never in this file:
#   npx wrangler secret put AUTH_SECRET --env production
#   npx wrangler secret put AUTH_SECRET --env preview
# (repeat for TOTP_ENCRYPTION_KEY, SETUP_TOKEN, CRON_SECRET, META_CAPI_TOKEN,
# TURNSTILE_SECRET_KEY, LICENSE_PORTAL_API_KEY, RESEND_API_KEY — see
# docs/RUNBOOK.md §3 for the rotation matrix.)
# ---------------------------------------------------------------------------

# --- production ------------------------------------------------------------
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
# The id below is INJECTED BY CI at deploy time (deploy.yml "Ensure Hyperdrive
# config" step): it ensures a config named `ecomate-db-prod` exists (creating it
# from the DIRECT_URL secret when missing), syncs its connection string to that
# same secret on every deploy, and patches the real id into this file in the
# runner workspace. The placeholder stays committed so no Hyperdrive id ever
# lives in git. Hyperdrive is a tunnel to YOUR Postgres (Supabase now, any
# Postgres later) — not a Cloudflare database; your data never leaves it.
id = "PASTE_PROD_HYPERDRIVE_ID"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
# Create with: npx wrangler r2 bucket create ecomate-media-prod
# then attach the public custom domain the app expects:
#   npx wrangler r2 bucket domain ecomate-media-prod --custom-domain media.ecomate.app
bucket_name = "ecomate-media-prod"

[env.production.vars]
NEXT_PUBLIC_SITE_URL = "https://ecomate.bd"
NEXT_PUBLIC_DEFAULT_LOCALE = "en"
NEXT_PUBLIC_META_PIXEL_ID = ""
NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""
# R2_PUBLIC_ORIGIN: optional dedicated media CDN origin (e.g.
# "https://media.dev.ecomate.bd" after `wrangler r2 bucket domain` + DNS).
# Unset (default) = same-origin `/media/<key>` proxy, which needs no DNS.
# R2_PUBLIC_ORIGIN = ""
AUTH_TRUST_HOST = "true"
RETENTION_DAYS = "180"

# Workers Logs, zero-config floor (Task 21 §5): structured JSON logs
# (`api.error`, `lead.notify`, `cron.retention.*`) are queryable in the
# dashboard without any further wiring.
[env.production.observability]
enabled = true

# No [env.production.triggers]: cron jobs run via .github/workflows/cron.yml
# (HTTP calls with CRON_SECRET), not Cloudflare scheduled events — the Worker
# exports no scheduled() handler, and triggers without one only produce errors.

# --- preview (per-PR) ------------------------------------------------------
[[env.preview.hyperdrive]]
binding = "HYPERDRIVE"
# Same CI injection as production (preview.yml step): ensures `ecomate-db-preview`,
# syncs it to PREVIEW_DIRECT_URL, patches the id at deploy time. Placeholder stays.
id = "PASTE_PREVIEW_HYPERDRIVE_ID"

[[env.preview.r2_buckets]]
binding = "R2_BUCKET"
# Create with: npx wrangler r2 bucket create ecomate-media-preview
bucket_name = "ecomate-media-preview"

[env.preview.vars]
# Replace with the real preview hostname once the preview worker has one
# (workers.dev URL or preview.ecomate.app route) — see docs/RUNBOOK.md §15.
NEXT_PUBLIC_SITE_URL = "https://preview.ecomate.app"
NEXT_PUBLIC_DEFAULT_LOCALE = "en"
NEXT_PUBLIC_META_PIXEL_ID = ""
NEXT_PUBLIC_TURNSTILE_SITE_KEY = ""
# R2_PUBLIC_ORIGIN: optional dedicated media CDN origin (e.g.
# "https://media.dev.ecomate.bd" after `wrangler r2 bucket domain` + DNS).
# Unset (default) = same-origin `/media/<key>` proxy, which needs no DNS.
# R2_PUBLIC_ORIGIN = ""
AUTH_TRUST_HOST = "true"
RETENTION_DAYS = "180"

# Deliberately NO [env.preview.triggers]: the retention sweep must not run
# against the preview database (it would anonymise fixture leads and burn
# pooled connections), and the publish scheduler must not publish preview
# drafts. Preview gets traffic only, never crons.
